services:
  db:
    image: mysql:8.0
    command: ["--log-bin-trust-function-creators=1", "--default-time-zone=+05:30"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - tt_mysql_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  graph:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - tt_neo4j_v2:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30

  api:
    build: ./api
    profiles: ["full"]          # local dev runs uvicorn on the host; `docker compose --profile full up` runs it here
    env_file: .env
    environment:
      MYSQL_HOST: db
      NEO4J_URI: bolt://graph:7687
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      graph:
        condition: service_healthy

volumes:
  tt_mysql_v2:
  tt_neo4j_v2:
